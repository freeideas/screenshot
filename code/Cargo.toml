[package]
name = "screenshot"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "screenshot"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
image = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"

[profile.release]
strip = true
lto = true
